<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Samarth Rao — AI/ML Engineer · Full-Stack Developer · Systems Tinkerer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.55" stop-color="#0b0624"/>
      <stop offset="1" stop-color="#021a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010d" stop-opacity="1"/>
      <stop offset="1" stop-color="#05010d" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .grid line { stroke: #a855f7; stroke-opacity: .28; stroke-width: 1; }
    .h { animation: scroll 2.4s linear infinite; }
    @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(24px); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- synthwave floor grid -->
    <g class="grid">
      <g class="h">
        <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="224" x2="1200" y2="224"/>
        <line x1="0" y1="248" x2="1200" y2="248"/><line x1="0" y1="272" x2="1200" y2="272"/>
        <line x1="0" y1="296" x2="1200" y2="296"/><line x1="0" y1="320" x2="1200" y2="320"/>
        <line x1="0" y1="176" x2="1200" y2="176"/>
      </g>
      <line x1="600" y1="180" x2="-600" y2="320"/><line x1="600" y1="180" x2="-200" y2="320"/>
      <line x1="600" y1="180" x2="200" y2="320"/><line x1="600" y1="180" x2="450" y2="320"/>
      <line x1="600" y1="180" x2="600" y2="320"/><line x1="600" y1="180" x2="750" y2="320"/>
      <line x1="600" y1="180" x2="1000" y2="320"/><line x1="600" y1="180" x2="1400" y2="320"/>
      <line x1="600" y1="180" x2="1800" y2="320"/>
    </g>

    <!-- window chrome -->
    <circle cx="34" cy="30" r="6" fill="#ff5f56"/><circle cx="54" cy="30" r="6" fill="#ffbd2e"/><circle cx="74" cy="30" r="6" fill="#27c93f"/>
    <text x="100" y="35" class="mono" font-size="14" fill="#7c7a99">sam@ryoku: ~/samarthrao34 — zsh</text>
    <text x="1166" y="35" class="mono pulse" font-size="13" fill="#27c93f" text-anchor="end">● ONLINE</text>

    <!-- prompt -->
    <text x="60" y="88" class="mono" font-size="20" fill="#00f0ff">❯ <tspan fill="#c4b5fd">whoami</tspan></text>

    <!-- name -->
    <text x="60" y="160" class="mono" font-size="64" font-weight="800" fill="url(#name)" filter="url(#glow)" letter-spacing="4">SAMARTH RAO</text>

    <!-- typed tagline -->
    <clipPath id="typed"><rect x="62" y="180" height="34" width="0">
      <animate attributeName="width" values="0;760;760;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <text x="62" y="204" class="mono" font-size="20" fill="#e2e8f0" clip-path="url(#typed)">AI/ML Engineer · Full-Stack Dev · Linux &amp; Systems Tinkerer</text>
    <rect x="62" y="226" width="12" height="4" fill="#00f0ff" class="cursor"/>

    <!-- right side HUD -->
    <g class="mono" font-size="13" fill="#7c7a99" text-anchor="end">
      <text x="1140" y="88">[ arch · hyprland · neovim ]</text>
      <text x="1140" y="110" fill="#a855f7">building emotionally intelligent AI</text>
      <text x="1140" y="132">privacy-first browsers · custom OSes</text>
    </g>

    <!-- scanline -->
    <rect class="scan" width="1200" height="40" fill="#00f0ff" opacity=".05"/>
    <rect width="1199" height="319" x=".5" y=".5" rx="18" fill="none" stroke="#a855f7" stroke-opacity=".5"/>
  </g>
</svg>
